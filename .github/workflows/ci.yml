name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lendbox_test
          POSTGRES_USER: lendbox
          POSTGRES_PASSWORD: lendbox-dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lendbox" --health-interval 2s --health-retries 20
    env:
      LENDBOX_TEST_DATABASE_URL: postgresql://lendbox:lendbox-dev@localhost:5432/lendbox_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests (DB tests run against the Postgres service)
        run: pytest -q
