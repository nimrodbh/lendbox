services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: lendbox
      POSTGRES_USER: lendbox
      POSTGRES_PASSWORD: lendbox-dev
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lendbox"]
      interval: 2s
      retries: 20

  app:
    build: .
    environment:
      LENDBOX_DATABASE_URL: postgresql://lendbox:lendbox-dev@db:5432/lendbox
      LENDBOX_DEV_MAIL: "1"  # local only: show the verification link on screen
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
